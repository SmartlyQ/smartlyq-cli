name: Bootstrap publish

# ONE-TIME workflow for the very first npm publish. npm's Trusted Publishing
# can only be configured on a package that already exists, so v0.1.0 goes out
# with a short-lived token. After it succeeds: configure the Trusted Publisher
# on the package (GitHub Actions: SmartlyQ/smartlyq-cli, generate.yml), then
# DELETE this workflow file and the NPM_TOKEN secret.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
