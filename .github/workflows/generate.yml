name: Regenerate

on:
  # Fired by the docs repository when openapi.json changes
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Bump and publish even if the spec is unchanged'
        type: boolean
        default: false
  schedule:
    # Daily safety net in case a dispatch is missed
    - cron: '40 4 * * *'

concurrency:
  group: regenerate-cli
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate from OpenAPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets npm verify publishes via Trusted Publishing (OIDC) - no token needed
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # No registry-url here: it writes a token-based .npmrc auth entry, and
      # publishing authenticates via Trusted Publishing (OIDC) instead.
      # Node 24 bundles an npm new enough for Trusted Publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      # npm makes a new version visible in two stages: the version document
      # and the dist-tag update first, the tarball on the CDN some minutes
      # later. This job is dispatched the moment the SDK publishes, so it
      # asks for a version the registry has already called `latest` and then
      # 404s fetching it. Run #90 died exactly that way - 0.1.36 published
      # at 09:24, this step 404'd at 09:28, and the same tarball served
      # fine at 09:43. Retrying is the fix; failing the whole regeneration
      # over a CDN that is still catching up is not.
      - name: Update SDK dependency to latest
        run: |
          for attempt in $(seq 1 10); do
            if npm install @smartlyqofficial/node@latest; then
              exit 0
            fi
            echo "::warning::SDK install attempt ${attempt}/10 failed - the tarball may not have propagated yet. Retrying in 60s."
            sleep 60
          done
          echo "::error::@smartlyqofficial/node@latest is still not installable after 10 attempts over ~10 minutes. This is no longer propagation lag - check the SDK publish."
          exit 1

      - name: Fetch latest OpenAPI spec
        run: npm run fetch-spec

      - name: Generate commands
        run: npm run generate

      - name: Generate README reference
        run: npm run generate:readme

      - name: Generate command tests
        run: npm run generate:tests

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if ! git diff --staged --quiet || [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and commit
        if: steps.changes.outputs.has_changes == 'true'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          git add -A
          git commit -m "chore: regenerate from OpenAPI spec

          Auto-generated CLI update ($NEW_VERSION)"

          # Retry with rebase to survive concurrent dispatches
          for attempt in 1 2 3; do
            if git push; then break; fi
            echo "Push attempt $attempt failed; rebasing and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 5))
          done

      # Runs unconditionally so the FIRST version publishes even with no spec
      # delta; later no-change runs see the version on npm and skip.
      - name: Check if version already published
        id: check_published
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          if npm view "@smartlyqofficial/cli@${CURRENT_VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version ${CURRENT_VERSION} already on npm, skipping publish."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Publishes via Trusted Publishing (OIDC): npm accepts this workflow's
      # GitHub-signed identity, so no token secret is involved.
      # NOTE: no continue-on-error. A failed publish must fail the run loudly -
      # otherwise versions keep bumping and releases keep cutting while npm
      # silently freezes.
      - name: Publish to npm
        if: steps.check_published.outputs.skip != 'true'
        run: npm publish --access public

      - name: Create GitHub Release
        if: steps.check_published.outputs.skip != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.check_published.outputs.version }}
          name: v${{ steps.check_published.outputs.version }}
          generate_release_notes: true
          body: |
            ## Auto-generated CLI update

            This release was generated from the latest OpenAPI spec.

            ```bash
            npm install -g @smartlyqofficial/cli@${{ steps.check_published.outputs.version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
